<app-head-bar></app-head-bar>
<app-search-bar [autos]="autoList" (filtered)="filteredList = $event"></app-search-bar>

<div class="container">
  @for (auto of filteredList; track auto.id) {
    <div class="auto-card">
      <img [src]="'/images/' + auto.photo" [alt]="auto.model">
      <div class="details">
        <h3>{{ auto.brand }} {{ auto.model }}</h3>
        <p>
          Power : {{ auto.power }}<br>
          Price : {{ auto.price }} DNT<br>
          Only {{ auto.availability }} units in stock
        </p>
        @if (selectedId === auto.id) {
          <p class="description">{{ auto.description }}</p>
        }
      </div>
      <div class="see_more">
        <button (click)="toggleDetails(auto.id)">
          {{ selectedId === auto.id ? 'See less' : 'See more ...' }}
        </button>
      </div>
    </div>
  }
</div>
